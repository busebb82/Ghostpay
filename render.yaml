# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ghostpay
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Demo oturumları bellekte tutulduğu için tüm istekler aynı işçiye gitmeli
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ANTHROPIC_API_KEY   # boş bırakılırsa demo modunda çalışır
        sync: false
      - key: AI_HOURLY_LIMIT     # saatlik en fazla Claude çağrısı
        value: "200"
