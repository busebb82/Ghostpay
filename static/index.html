<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GhostPay — Abonelik Yönetimi</title>
  <meta name="description" content="GhostPay: Moka United sanal kartlarıyla abonelikleri tek panelden yöneten, yapay zekâ destekli churn ve tasarruf analizi sunan demo platform.">
  <meta name="theme-color" content="#12121b">
  <meta property="og:title" content="GhostPay — Yapay zekâ destekli abonelik yönetimi">
  <meta property="og:description" content="Her aboneliğe ayrı sanal kart, tek dokunuşla dondurma, zam tespiti, kişisel tasarruf önerileri ve şirketler için churn analizi.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2a8 8 0 0 0-8 8v11l2.7-2 2.6 2 2.7-2 2.7 2 2.6-2L20 21V10a8 8 0 0 0-8-8z' fill='%23a594f9'/></svg>">
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <a class="skip-link" href="#main">İçeriğe geç</a>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-row">
          <svg class="ghost" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2a8 8 0 0 0-8 8v11l2.7-2 2.6 2 2.7-2 2.7 2 2.6-2L20 21V10a8 8 0 0 0-8-8z"/>
            <circle cx="9.3" cy="10.5" r="1.3"/><circle cx="14.7" cy="10.5" r="1.3"/>
          </svg>
          <span class="brand-name">Ghost<span>Pay</span></span>
        </div>
        <div class="brand-sub">MOKA UNITED</div>
      </div>

      <nav class="nav" aria-label="Paneller">
        <a href="#b2c" data-view="b2c">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span class="long">B2C-Müşteri Paneli</span><span class="short">Müşteri</span>
        </a>
        <a href="#b2b" data-view="b2b">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M10 21v-4h4v4"/></svg>
          <span class="long">B2B-Şirket Paneli</span><span class="short">Şirket</span>
        </a>
        <a href="#islemler" data-view="islemler">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h10M7 14h6"/></svg>
          <span class="long">İşlem Geçmişi</span><span class="short">İşlemler</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <span class="ai-badge">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/></svg>
          Yapay Zeka Destekli Analiz
        </span>
        <span id="mode-badge" class="mode-badge" hidden
              title="API anahtarı tanımlı değil: yapay zekâ yanıtları davranış verisinden kural tabanlı üretiliyor.">
          Demo modu
        </span>
        <button class="refresh-btn" data-action="refresh" aria-label="Analizi yenile">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>
          <span class="lbl">Analizi Yenile</span>
        </button>
        <div class="copyright">GhostPay © 2026</div>
      </div>
    </aside>

    <main id="main" class="main" tabindex="-1">
      <div class="boot" aria-busy="true" aria-label="Yükleniyor">
        <div class="skeleton"><i class="big" style="width:260px"></i></div>
        <div class="kpis">
          <div class="panel kpi skeleton"><i style="width:50%"></i><i class="big"></i></div>
          <div class="panel kpi skeleton"><i style="width:50%"></i><i class="big"></i></div>
          <div class="panel kpi skeleton"><i style="width:50%"></i><i class="big"></i></div>
          <div class="panel kpi skeleton"><i style="width:50%"></i><i class="big"></i></div>
        </div>
        <div class="grid-2">
          <div class="panel skeleton" style="height:230px"></div>
          <div class="panel skeleton" style="height:230px"></div>
        </div>
      </div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/static/app.js"></script>
</body>
</html>
