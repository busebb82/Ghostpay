<!DOCTYPE html>

  <meta name="theme-color" content="#0f0f16">
  <meta property="og:title" content="GhostPay — Yapay zekâ destekli abonelik yönetimi">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2a8 8 0 0 0-8 8v11l2.7-2 2.6 2 2.7-2 2.7 2 2.6-2L20 21V10a8 8 0 0 0-8-8z' fill='%23a594f9'/></svg>">

<body>
  <div class="app">
    <aside class="sidebar">

          <span class="brand-name">Ghost<span>Pay</span></span>

        <div class="brand-sub">MOKA UNITED</div>
      </div>

      <nav class="nav">
        <a href="#b2c" data-view="b2c">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>

        <a href="#b2b" data-view="b2b">

        </a>
        <a href="#islemler" data-view="islemler">

          Yapay Zeka Destekli Analiz
        </span>

    <main id="main" class="main"></main>

  <script src="/static/app.js"></script>
